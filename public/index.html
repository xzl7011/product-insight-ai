<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>需求洞察 AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1>需求洞察 AI</h1>
    <p class="sub">把模糊的产品想法转化为结构化需求</p>

    <section class="card">
      <label>输入你的产品想法</label>

      <textarea
        id="idea"
        placeholder="例如：为经常加班的职场人设计一个智能任务管理工具"
      ></textarea>

      <button id="analyze">开始分析</button>
    </section>

    <section id="loading" class="hidden">
      正在生成需求分析…
    </section>

    <section id="result" class="card hidden"></section>

    <section class="card feedback">
      <h2>用户反馈</h2>

      <button class="rate" data-rate="满意">😊 满意</button>
      <button class="rate" data-rate="需要改进">😐 需要改进</button>

      <input
        id="comment"
        placeholder="告诉我们哪里可以改进"
      >

      <button id="sendFeedback">提交反馈</button>

      <p id="feedbackMsg"></p>
    </section>

    <p class="note">
      当前为 MVP 演示模式；后续可接入真实 AI API 扩展分析能力。
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
